# ─────────────────────────────────────────────────────────────────────────────
# vLLM sidecar — standard NVIDIA GPU (x86_64)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up -d --build
#
# vLLM serves an OpenAI-compatible API; LiteLLM routes to it automatically.
# Set VLLM_MODEL in .env to choose which HuggingFace model to load.
# ─────────────────────────────────────────────────────────────────────────────

services:
  vllm:
    build:
      context: ./vllm
      dockerfile: Dockerfile
    image: ai-stack/vllm:cuda
    container_name: ai-vllm
    restart: unless-stopped
    volumes:
      - vllm-models:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--model"
      - "${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ai-network
    profiles:
      - vllm

volumes:
  vllm-models:
