# ─────────────────────────────────────────────────────────────────────────────
# GH200 Grace Hopper override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gh200.yml up -d --build
#
# Targets NVIDIA GH200 (ARM64 + Hopper GPU, sm_90)
# Prerequisites:
#   - NVIDIA driver 550+ on ARM64 host
#   - nvidia-container-toolkit installed
#   - Test: docker run --rm --gpus all --platform linux/arm64 \
#           nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
# ─────────────────────────────────────────────────────────────────────────────

services:
  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile.gh200
      args:
        COMFYUI_TAG: ${COMFYUI_TAG:-latest}
    image: ai-stack/comfyui:gh200
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # BF16 native on Hopper — faster + more accurate than FP16
      - COMFYUI_ARGS=--listen 0.0.0.0 --port 8188 --bf16-unet --bf16-vae
      # Torch compile with Hopper-optimised inductor backend
      - TORCHINDUCTOR_COMPILE_THREADS=8
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,expandable_segments:True

  # vLLM on GH200 — replaces Ollama for local models (much higher throughput on Hopper)
  vllm:
    build:
      context: ./vllm
      dockerfile: Dockerfile.gh200
    image: ai-stack/vllm:gh200
    container_name: ai-vllm
    restart: unless-stopped
    volumes:
      - vllm-models:/root/.cache/huggingface
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-8192}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # GH200 has 96 GB HBM3 — can serve very large models
      - VLLM_DTYPE=bfloat16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-network
    profiles:
      - vllm

  # Override Ollama to use GPU on GH200 (arm64 image)
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vllm-models:
