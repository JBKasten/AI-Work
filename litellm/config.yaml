# ─────────────────────────────────────────────────────────────────────────────
# LiteLLM Proxy Configuration
# Documentation: https://docs.litellm.ai/docs/proxy/configs
#
# This file is mounted read-only into the LiteLLM container.
# Add/remove models to match your available API keys.
# ─────────────────────────────────────────────────────────────────────────────

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Rate limiting
  max_budget: null          # Set a $ cap if you want, e.g. 10.00
  budget_duration: null     # "1d", "7d", "30d"

litellm_settings:
  # Logging — set to true for verbose request logs
  set_verbose: false
  drop_params: true          # Silently drop unsupported params per model
  success_callback: []       # e.g. ["langfuse", "helicone"]
  failure_callback: []

router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: null           # Optional: add Redis for distributed routing
  num_retries: 3
  timeout: 60                # Increased for coding tasks (longer outputs)
  allowed_fails: 2

model_list:

  # ════════════════════════════════════════════════════════════════════════════
  #  CODING-OPTIMIZED MODELS
  #  These aliases route to the best models for code generation, review, and
  #  debugging. Use "code" as the model name for automatic best-model routing.
  # ════════════════════════════════════════════════════════════════════════════

  # ───────── Best-of-breed coding alias (tries Claude → GPT-4o → Gemini) ───
  - model_name: code
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Primary coding model — Claude Sonnet 4.5 (excellent at code)"

  - model_name: code
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Coding fallback — GPT-4o"

  - model_name: code
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      description: "Coding fallback — Gemini 2.0 Flash"

  # ───────── Fast coding (quick completions, autocomplete, small tasks) ─────
  - model_name: code-fast
    litellm_params:
      model: anthropic/claude-haiku-3-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Fast coding — Haiku 3.5 (quick + cheap)"

  - model_name: code-fast
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
    model_info:
      description: "Fast coding fallback — Groq Llama 3.3 70B"

  - model_name: code-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Fast coding fallback — GPT-4o Mini"

  # ───────── Heavy coding (architecture, complex refactoring, debugging) ────
  - model_name: code-heavy
    litellm_params:
      model: anthropic/claude-opus-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Heavy coding — Claude Opus 4.5 (most capable)"

  - model_name: code-heavy
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Heavy coding fallback — GPT-4o"

  # ───────── Code review specialised alias ──────────────────────────────────
  - model_name: code-review
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Code review — Claude Sonnet 4.5"

  - model_name: code-review
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Code review fallback — GPT-4o"

  # ════════════════════════════════════════════════════════════════════════════
  #  GENERAL MODELS
  # ════════════════════════════════════════════════════════════════════════════

  # ───────── OpenAI ─────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4-turbo
    litellm_params:
      model: openai/gpt-4-turbo
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o3-mini
    litellm_params:
      model: openai/o3-mini
      api_key: os.environ/OPENAI_API_KEY

  # ───────── Anthropic ─────────
  - model_name: claude-opus-4
    litellm_params:
