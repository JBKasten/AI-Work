  # ════════════════════════════════════════════════════════════════════════════
  #  LOCAL MODELS
  # ════════════════════════════════════════════════════════════════════════════

  # ───────── Local Ollama (via sidecar container) ─────────
  - model_name: ollama/llama3.2
    litellm_params:
      model: ollama/llama3.2
