# ─────────────────────────────────────────────────────────────────────────────
# AI Stack — Nginx virtual host
#
# Routes:
#   /              → Open WebUI  (port 8080)
#   /litellm/      → LiteLLM     (port 4000)  — admin UI + API
#   /comfyui/      → ComfyUI     (port 8188)
# ─────────────────────────────────────────────────────────────────────────────

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

upstream litellm {
    server litellm:4000;
    keepalive 32;
}

upstream comfyui {
    server comfyui:8188;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Open WebUI (root) ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (Open WebUI uses SSE / WS for streaming)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Streaming — disable buffering
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── LiteLLM Proxy (API + optional admin UI) ──────────────────────────────
    # Example API call: curl http://localhost/litellm/v1/chat/completions
    location /litellm/ {
        rewrite ^/litellm/(.*)$ /$1 break;

        proxy_pass         http://litellm;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming (LLM token streaming)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── ComfyUI ──────────────────────────────────────────────────────────────
    location /comfyui/ {
        rewrite ^/comfyui/(.*)$ /$1 break;

        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (ComfyUI uses WS for progress updates)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # ── ComfyUI WebSocket endpoint (direct path used by frontend) ────────────
    location /ws {
        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}
