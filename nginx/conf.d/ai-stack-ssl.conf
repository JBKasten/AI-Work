# ─────────────────────────────────────────────────────────────────────────────
# AI Stack — Nginx SSL/TLS virtual host
# Used when HTTPS is enabled via scripts/setup-ssl.sh
#
# This file is NOT active by default.
# scripts/setup-ssl.sh replaces ai-stack.conf with this file after cert issuance.
# ─────────────────────────────────────────────────────────────────────────────

upstream open_webui_ssl {
    server open-webui:8080;
    keepalive 32;
}

upstream litellm_ssl {
    server litellm:4000;
    keepalive 32;
}

upstream comfyui_ssl {
    server comfyui:8188;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # Mozilla Intermediate SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (enable once you're confident HTTPS is working)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 2G;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    map $http_upgrade $connection_upgrade_ssl {
        default upgrade;
        ''      close;
    }

    # ── Open WebUI ────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://open_webui_ssl;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade_ssl;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── LiteLLM ───────────────────────────────────────────────────────────────
    location /litellm/ {
        rewrite ^/litellm/(.*)$ /$1 break;
        proxy_pass         http://litellm_ssl;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── ComfyUI ───────────────────────────────────────────────────────────────
    location /comfyui/ {
        rewrite ^/comfyui/(.*)$ /$1 break;
        proxy_pass         http://comfyui_ssl;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade_ssl;
    }

    location /ws {
        proxy_pass         http://comfyui_ssl;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade_ssl;
        proxy_set_header   Host              $host;
    }

    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}
