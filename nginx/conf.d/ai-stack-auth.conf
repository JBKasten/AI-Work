# ─────────────────────────────────────────────────────────────────────────────
# AI Stack — Nginx virtual host with Authelia MFA
#
# This config is activated by docker-compose.auth.yml.
# All routes require 2FA (WebAuthn/YubiKey or TOTP) except:
#   - /health endpoints
#   - /litellm/v1/* API (uses bearer token auth)
#   - /authelia/* (the auth portal itself)
# ─────────────────────────────────────────────────────────────────────────────

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

upstream litellm {
    server litellm:4000;
    keepalive 32;
}

upstream comfyui {
    server comfyui:8188;
    keepalive 32;
}

upstream authelia_backend {
    server authelia:9091;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Authelia internal auth endpoint ────────────────────────────────────
    include /etc/nginx/snippets/authelia-location.conf;

    # ── Authelia portal (login/register UI) ───────────────────────────────
    # Accessible without auth (it IS the auth)
    location /authelia/ {
        proxy_pass         http://authelia_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-URI   $request_uri;
    }

    # Authelia API (used by the portal JS)
    location /authelia/api/ {
        proxy_pass         http://authelia_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check (no auth) ─────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # ── LiteLLM API (bearer token only, no browser MFA) ───────────────────
    # Programmatic API access uses LiteLLM's own key auth
    location /litellm/v1/ {
        rewrite ^/litellm/(.*)$ /$1 break;

        proxy_pass         http://litellm;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── LiteLLM Admin UI (MFA protected) ──────────────────────────────────
    location /litellm/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        rewrite ^/litellm/(.*)$ /$1 break;

        proxy_pass         http://litellm;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Open WebUI (MFA protected) ────────────────────────────────────────
    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        proxy_pass         http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── ComfyUI (MFA protected) ───────────────────────────────────────────
    location /comfyui/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        rewrite ^/comfyui/(.*)$ /$1 break;

        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # ── ComfyUI WebSocket (MFA protected) ──────────────────────────────────
    location /ws {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }
}
