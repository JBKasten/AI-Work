# ─────────────────────────────────────────────────────────────────────────────
# AI Stack — Development Environment Nginx Config
#
# Routes:
#   /              → Open WebUI  (chat + AI)
#   /litellm/      → LiteLLM     (LLM proxy API)
#   /comfyui/      → ComfyUI     (image generation)
#   /code/         → code-server  (VS Code)
#   /git/          → Gitea        (Git server)
#   /jupyter/      → Jupyter      (notebooks)
#   /sandbox/      → Code Sandbox (execution API)
# ─────────────────────────────────────────────────────────────────────────────

upstream open_webui {
    server open-webui:8080;
    keepalive 32;
}

upstream litellm {
    server litellm:4000;
    keepalive 32;
}

upstream comfyui {
    server comfyui:8188;
    keepalive 32;
}

upstream code_server {
    server code-server:8080;
    keepalive 32;
}

upstream gitea {
    server gitea:3000;
    keepalive 32;
}

upstream jupyter {
    server jupyter:8888;
    keepalive 32;
}

upstream sandbox {
    server sandbox:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # ── Health check (no auth) ─────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # ── code-server (VS Code in browser) ──────────────────────────────────
    location /code/ {
        rewrite ^/code/(.*)$ /$1 break;

        proxy_pass         http://code_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (critical for VS Code terminal + editor)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_buffering    off;
    }

    # ── Gitea (self-hosted Git) ───────────────────────────────────────────
    location /git/ {
        # Gitea handles its own sub-path via ROOT_URL
        proxy_pass         http://gitea/git/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Jupyter ───────────────────────────────────────────────────────────
    location /jupyter/ {
        proxy_pass         http://jupyter/jupyter/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (Jupyter kernel communication)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_buffering    off;
    }

    # Jupyter WebSocket kernel endpoint
    location ~* /jupyter/api/kernels/ {
        proxy_pass         http://jupyter;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # ── Code Sandbox API ──────────────────────────────────────────────────
    location /sandbox/ {
        rewrite ^/sandbox/(.*)$ /$1 break;

        proxy_pass         http://sandbox;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Longer timeout for code execution
        proxy_read_timeout 120s;
    }

    # ── Open WebUI (root — chat + AI) ─────────────────────────────────────
    location / {
        proxy_pass         http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── LiteLLM Proxy ─────────────────────────────────────────────────────
    location /litellm/ {
        rewrite ^/litellm/(.*)$ /$1 break;

        proxy_pass         http://litellm;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── ComfyUI ───────────────────────────────────────────────────────────
    location /comfyui/ {
        rewrite ^/comfyui/(.*)$ /$1 break;

        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # ── ComfyUI WebSocket ─────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://comfyui;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }
}
