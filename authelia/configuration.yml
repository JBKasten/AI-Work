# ─────────────────────────────────────────────────────────────────────────────
# Authelia — MFA Configuration for AI Stack
#
# Supports:
#   - WebAuthn / FIDO2 (YubiKey, hardware security keys)
#   - TOTP (Google Authenticator, Authy, etc.)
#   - Username/password as first factor
#
# Generated by: scripts/setup-mfa.sh
# Docs: https://www.authelia.com/configuration/
# ─────────────────────────────────────────────────────────────────────────────

# Theme
theme: dark

# Server settings
server:
  address: 'tcp://0.0.0.0:9091'

# Logging
log:
  level: info

# ── JWT secret (overridden by env AUTHELIA_JWT_SECRET) ───────────────────────
jwt_secret: insecure_jwt_secret_change_me

# ── Default 2FA policy ──────────────────────────────────────────────────────
#  "two_factor" = password + TOTP/WebAuthn required for everything
#  "one_factor" = password only (no MFA)
#  "bypass"     = no auth at all
default_2fa_method: webauthn

# ── Access Control ──────────────────────────────────────────────────────────
access_control:
  default_policy: two_factor

  rules:
    # Health check endpoints — no auth needed
    - domain_regex: '.*'
      policy: bypass
      resources:
        - '^/health$'
        - '^/api/health$'

    # LiteLLM API — bearer token auth (no browser MFA needed)
    # API clients authenticate with their LiteLLM key
    - domain_regex: '.*'
      policy: one_factor
      resources:
        - '^/litellm/v1/.*'

    # Everything else requires 2FA
    - domain_regex: '.*'
      policy: two_factor

# ── Session ─────────────────────────────────────────────────────────────────
session:
  name: authelia_session
  secret: insecure_session_secret_change_me
  expiration: 12h
  inactivity: 2h
  remember_me: 1M

  cookies:
    - domain: 'localhost'
      authelia_url: 'http://localhost/authelia'
      default_redirection_url: 'http://localhost'

# ── Storage — local SQLite (simple, no extra DB needed) ─────────────────────
storage:
  encryption_key: insecure_encryption_key_change_me
  local:
    path: /config/db.sqlite3

# ── Notifier — filesystem (for dev/self-hosted; swap for SMTP in prod) ──────
notifier:
  filesystem:
    filename: /config/notification.txt

# ── TOTP ────────────────────────────────────────────────────────────────────
totp:
  disable: false
  issuer: AI-Stack
  algorithm: SHA1
  digits: 6
  period: 30
  skew: 1

# ── WebAuthn / FIDO2 (YubiKey, hardware keys) ──────────────────────────────
webauthn:
  disable: false
  display_name: AI Stack
  attestation_conveyance_preference: indirect
  user_verification: preferred
  timeout: 60s

# ── Password policy ────────────────────────────────────────────────────────
password_policy:
  standard:
    enabled: true
    min_length: 8
    max_length: 0
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: false

# ── Authentication backend — file-based ─────────────────────────────────────
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16
